name: Zadanie 2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja QEMU
        uses: docker/setup-qemu-action@v3

      - name: Konfiguracja Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do GHCR (GitHub Packages)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Logowanie do DockerHub (dla zapisu Cache)
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generowanie metadanych i tagów
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=true
          tags: |
            type=ref,event=branch
            type=sha,priority=100,prefix=sha-,format=short
            type=semver,priority=200,pattern={{version}}


      - name: Budowa obrazu lokalnego dla testu CVE
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true 
          tags: local-test:latest
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/pawcho-cache:cache


      - name: Test CVE (Trivy Scanner)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-test:latest'
          format: 'table'
          exit-code: '1' 
          severity: 'CRITICAL,HIGH' 


      - name: Budowa Multi-Arch i wysłanie obrazu
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64 
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/pawcho-cache:cache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/pawcho-cache:cache,mode=max
